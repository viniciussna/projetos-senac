<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#cc0000">
  <link rel="manifest" href="manifest.json">
  <title>CardPokemon – Sortear</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-wrapper">
    <header class="app-header">
      <div class="header-pokeball">
        <div class="pb-top"></div><div class="pb-band"></div>
        <div class="pb-bottom"></div><div class="pb-button"></div>
      </div>
      <h1 class="app-title">Card<span>Pokémon</span></h1>
      <div id="shake-hint" class="shake-hint">📳 Agite!</div>
    </header>

    <main class="card-area">

      <div id="card-container" class="card-container">
        <div class="card card-empty" id="pokemon-card">
          <div class="card-inner">
            <div class="empty-state">
              <div class="pokeball-big">
                <div class="pb-top"></div><div class="pb-band"></div>
                <div class="pb-bottom"></div><div class="pb-button"></div>
              </div>
              <p>Toque para revelar<br>um Pokémon!</p>
            </div>
          </div>
        </div>
      </div>

      <button class="draw-btn" id="btnDraw">
        <span class="btn-icon">✦</span>
        <span class="btn-text">Sortear Pokémon</span>
        <span class="btn-icon">✦</span>
      </button>

      <!-- Stats bar -->
      <div id="stats-bar" class="stats-bar hidden">
        <div class="stat-item">
          <span class="stat-label">HP</span>
          <div class="stat-track"><div class="stat-fill" id="fill-hp"></div></div>
          <span class="stat-value" id="val-hp">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">ATK</span>
          <div class="stat-track"><div class="stat-fill" id="fill-atk"></div></div>
          <span class="stat-value" id="val-atk">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">DEF</span>
          <div class="stat-track"><div class="stat-fill" id="fill-def"></div></div>
          <span class="stat-value" id="val-def">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">VEL</span>
          <div class="stat-track"><div class="stat-fill" id="fill-spd"></div></div>
          <span class="stat-value" id="val-spd">--</span>
        </div>
      </div>

      <!-- Botões de classificação -->
      <div id="rating-buttons" class="rating-buttons hidden">
        <button class="rate-btn btn-escapar"  onclick="salvar('deixa_escapar')">❌<span>Deixa escapar</span></button>
        <button class="rate-btn btn-pokedex"  onclick="salvar('pokedex')">🔵<span>Pokédex</span></button>
        <button class="rate-btn btn-time"     onclick="salvar('time_favorito')">⭐<span>Time favorito</span></button>
      </div>

      <p id="msg" class="msg-salvo"></p>

      <button class="btn-nav" onclick="window.location.href='index.html'">← Voltar</button>

    </main>

    <footer class="app-footer">
      <p>CardPokemon · <a href="https://pokeapi.co" target="_blank">PokéAPI</a></p>
    </footer>
  </div>

  <script src="sorteio.js"></script>
</body>
</html>
