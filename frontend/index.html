<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#cc0000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>CardPokemon</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- SPLASH -->
  <div id="splash">
    <div class="splash-inner">
      <div class="pokeball-icon">
        <div class="pb-top"></div><div class="pb-band"></div>
        <div class="pb-bottom"></div><div class="pb-button"></div>
      </div>
      <p class="splash-title">CardPokemon</p>
    </div>
  </div>

  <div class="app-wrapper">
    <header class="app-header">
      <div class="header-pokeball">
        <div class="pb-top"></div><div class="pb-band"></div>
        <div class="pb-bottom"></div><div class="pb-button"></div>
      </div>
      <h1 class="app-title">Card<span>Pokémon</span></h1>
    </header>

    <main class="card-area home-area">
      <div class="home-pokeball">
        <div class="pb-top"></div><div class="pb-band"></div>
        <div class="pb-bottom"></div><div class="pb-button"></div>
      </div>
      <p class="home-sub">Sorteie Pokémons e monte sua coleção!</p>
      <div class="home-buttons">
        <button class="draw-btn" onclick="window.location.href='sorteio.html'">
          <span class="btn-icon">✦</span>
          <span class="btn-text">Sortear Pokémon</span>
          <span class="btn-icon">✦</span>
        </button>
        <button class="draw-btn btn-secondary" onclick="window.location.href='colecao.html'">
          <span class="btn-icon">◈</span>
          <span class="btn-text">Minha Coleção</span>
          <span class="btn-icon">◈</span>
        </button>
      </div>
    </main>

    <footer class="app-footer">
      <p>CardPokemon · <a href="https://pokeapi.co" target="_blank">PokéAPI</a></p>
    </footer>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('splash').classList.add('hidden'), 1400);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
    }
  </script>
</body>
</html>
